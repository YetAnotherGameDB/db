name: Validate JSON

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
    branches:
      - '*'

jobs:
  validate:
    runs-on: ubuntu-latest
    #container: dcycle/json-lint:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Validate JSON using Docker
      uses: addnab/docker-run-action@v3
      with:
        image: dcycle/json-lint:latest
        options: -v ${{ github.workspace }}:/work
        run: |
          echo "Linting games.json"
          jsonlint -q /work/games.json
  integrity:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run validation script
        run: pwsh .github/scripts/validate-games.ps1

  publish:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, integrity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp games.json _site/games.json
          gzip -9 -c games.json > _site/games.json.gz
          python3 .github/scripts/build-sqlite.py games.json _site/games.db
          cp site/index.html _site/index.html

      - name: Publish to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          publish() {
            rm -rf pages _site/.git
            LEASE=""
            if git clone -q --depth 1 --branch gh-pages "$REPO_URL" pages 2>/dev/null; then
              EXPECTED=$(git -C pages rev-parse HEAD)
              LEASE="--force-with-lease=refs/heads/gh-pages:$EXPECTED"
              # thumbnails/ on gh-pages is maintained externally - keep it
              rm -rf _site/thumbnails
              [ -d pages/thumbnails ] && cp -r pages/thumbnails _site/thumbnails
              rm -rf pages
            fi
            git -C _site init -q -b publish
            git -C _site add -A
            git -C _site -c user.name=github-actions \
                         -c user.email=github-actions@github.com \
                         commit -q -m "publish site"
            git -C _site push $LEASE "$REPO_URL" HEAD:refs/heads/gh-pages
          }
          # single orphan commit each deploy keeps the branch at site size;
          # the lease + one retry handles a concurrent gh-pages writer
          publish || { echo "push raced, retrying"; publish; }
